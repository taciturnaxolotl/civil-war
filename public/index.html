<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Civil War Scoreboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f1219">
<meta name="description" content="Team Cap vs. Team Stark. Let the thunderdome begin.">
<meta property="og:site_name" content="Civil War">
<meta property="og:type" content="website">
<meta property="og:title" content="Civil War">
<meta property="og:description" content="Team Cap vs. Team Stark. Let the thunderdome begin.">
<meta property="og:url" content="/">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Civil War: Team Cap vs. Team Stark">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Civil War</h1>
    <p class="sub">Let the thunderdome begin</p>
  </header>

  <section class="versus" aria-label="Team scores this week">
    <div class="side cap"><div class="lbl">Team Cap</div><div class="pts num" id="capPts">0</div></div>
    <div class="vs">vs</div>
    <div class="side stark"><div class="lbl">Team Stark</div><div class="pts num" id="starkPts">0</div></div>
  </section>
  <div class="bar" aria-hidden="true"><i class="c" id="barC" style="width:50%"></i><i class="s" id="barS" style="width:50%"></i></div>

  <div class="grid">
    <div class="col">
      <form class="panel entry" id="form" autocomplete="off">
        <div class="panel-head"><h2>Killllll em</h2><input type="date" id="day" class="day" aria-label="Day of the kill"></div>
        <div class="step" id="killerStep"></div>
        <div class="step" id="victimStep" hidden>
          <div class="step-label">One who suffered an ignominious end</div>
          <div class="picker" id="victims"></div>
        </div>
        <div class="step" id="methodStep" hidden>
          <div class="step-label">How?</div>
          <div class="seg" role="group" aria-label="How the kill happened">
            <button type="button" data-method="regular">Regular</button>
            <button type="button" data-method="special">Special <span class="star">★</span></button>
            <button type="button" data-method="rps">Rock paper scissors</button>
          </div>
          <div class="scale" id="scaleWrap" hidden>
            <span id="scaleLabel"></span>
            <div class="seg" id="scale" role="group" aria-label="Points for the special"></div>
          </div>
          <label class="toggle" id="bonusWrap" hidden><input type="checkbox" id="bonus"><span id="bonusText"></span><b>+1</b></label>
          <input type="text" id="note" maxlength="140" placeholder="What made it extra special? (optional)" hidden>
        </div>
        <div class="warn" id="warn" hidden></div>
        <button class="go" id="submit" type="submit" disabled>Log kill</button>
        <div class="gate" id="gate" hidden>
          <input type="password" id="password" placeholder="Game password to log kills" autocomplete="current-password">
          <button class="ghost" type="button" id="unlock">Unlock</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </form>

      <section class="panel">
        <h2>Kill feed</h2>
        <ul class="feed" id="feed"><li class="empty" style="display:block">Loading kills…</li></ul>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2>Standings this week</h2>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>#</th><th>Player</th><th class="r">Kills</th><th class="r">Pts</th></tr></thead>
          <tbody id="standings"></tbody>
        </table></div>
      </section>
      <section class="panel" id="chartPanel" hidden>
        <div class="panel-head"><h2>Weeks won</h2><span class="legend"><span class="cap">Cap</span><span class="stark">Stark</span></span></div>
        <div id="chart"></div>
      </section>
      <section class="panel" id="pastPanel" hidden>
        <h2>Past weeks</h2>
        <ul class="past" id="past"></ul>
      </section>
    </div>
  </div>
</div>
</body>
</html>
